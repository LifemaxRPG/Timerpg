<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street Prototype</title>
<style>
  :root { --bg:#0e1220; --panel:rgba(16,20,34,.82); --ink:#eef0fa; --mute:#9aa3cc; --line:#3a4268; --accent:#6fa8ff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#e9edf6; --panel:rgba(255,255,255,.86); --ink:#14182a; --mute:#59618a; --line:#c4cbe3; --accent:#2f6fe0; } }
  :root[data-theme="light"] { --bg:#e9edf6; --panel:rgba(255,255,255,.86); --ink:#14182a; --mute:#59618a; --line:#c4cbe3; --accent:#2f6fe0; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; backdrop-filter:blur(6px); }
  #top { top:calc(10px + env(safe-area-inset-top)); left:12px; right:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #top b { font-size:15px; }
  #top label { display:flex; gap:8px; align-items:center; color:var(--mute); }
  #top input[type=range] { width:min(220px,40vw); accent-color:var(--accent); }
  button { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:7px 11px; font:inherit; cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #pad { bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:8px; }
  #pad button { min-width:52px; min-height:46px; font-size:18px; }
  #hint { bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); color:var(--mute); font-size:12px; padding:6px 10px; width:max-content; max-width:calc(100vw - 32px); text-align:center; pointer-events:none; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--mute); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">Loading sprites…</div>
<div id="top" class="panel">
  <b>Street 2.5D</b>
  <label>Time <input id="time" type="range" min="0" max="24" step="0.05" value="17.6"><span id="clock">5:36 PM</span></label>
  <button id="fx" class="on" title="Turn the box sides, roofs, shadows and lighting on or off">2.5D effect: on</button>
  <button id="auto" class="on">Auto-walk</button>
</div>
<div id="hint" class="panel">Drag or use ◀ ▶ to walk · ▲ ▼ to change lane (sidewalk / road / far sidewalk)</div>
<div id="pad" class="panel"><button id="bl">◀</button><button id="bu">▲</button><button id="bd">▼</button><button id="br">▶</button></div>
<script>window.ASSETS = /*__ASSETS__*/{};</script>
<script>
'use strict';
// ===================== constants (world units = sprite pixels) =====================
const DX = 34, DY = 16;               // widest side face, roof depth on screen (see Perspective.kt)
const FLOOR_H = 56, CORNICE_H = 8, BODY_H = 96, SIDE_D = 120;
const K = 0.9;                         // how fast the side comes round with distance from the middle of the view
const LANES = [{ y: 26, p: 1.0 }, { y: 76, p: 1.07 }, { y: 120, p: 1.16 }];   // sidewalk, road, far sidewalk
const SPLAY = 0.9, FLAT = 0.5;

const A = window.ASSETS, IM = {};
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
let seedv = 7; const rnd = () => (seedv = (seedv * 16807) % 2147483647) / 2147483647;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

// ===================== time of day =====================
const KEYS = [
  [0, '#0b1030', '#1b2550', [60, 74, 130]], [5, '#1a2150', '#5b4a7a', [110, 110, 165]], [6.5, '#5a7fb8', '#ffc79a', [255, 200, 165]],
  [9, '#5aa2e0', '#bfe3f7', [255, 248, 238]], [12, '#4a98e0', '#bfe6fa', [255, 255, 255]], [16, '#5aa0dc', '#d7ecf5', [255, 246, 232]],
  [18, '#4a6fb0', '#ffb070', [255, 190, 125]], [19.6, '#2b3068', '#c4667a', [170, 130, 175]], [21, '#10173d', '#2a3566', [75, 88, 150]], [24, '#0b1030', '#1b2550', [60, 74, 130]],
];
function atHour(h) {
  let i = 0; while (i < KEYS.length - 2 && h > KEYS[i + 1][0]) i++;
  const a = KEYS[i], b = KEYS[i + 1], t = smooth(clamp((h - a[0]) / (b[0] - a[0]), 0, 1));
  return { top: mix(hex(a[1]), hex(b[1]), t), bot: mix(hex(a[2]), hex(b[2]), t), grade: mix(a[3], b[3], t) };
}
// the key light (sun by day, moon by night), after SceneLight.key: light travels along (across, -down, out)
function keyLight(h) {
  const night = h < 5.8 || h >= 18.6;
  const t = night ? (((h - 18.6 + 24) % 24) / 11.2) : (h - 5.8) / 12.8;     // 0..1 across the sky
  const up = Math.sin(Math.PI * clamp(t, 0, 1));
  const side = clamp((t - .5) * 2.2, -.92, .92);
  const el = (10 + 42 * up) * Math.PI / 180, level = Math.cos(el);
  const across = -side * level, out = Math.sqrt(Math.max(0, 1 - side * side)) * level, down = Math.sin(el);
  const rise = smooth(clamp(up / .3, 0, 1));
  const strength = night ? .3 * rise : rise * (.45 + .55 * clamp(up * 1.6, 0, 1));
  return { night, t, up, across, out, down, strength, lean: across / down, reach: FLAT * out / down };
}

// ===================== procedural pixel art for the parts our sprites don't have =====================
function brick(c, x, y, w, h, base, mortar, seed) {
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(x, y, w, h);
  seedv = seed;
  for (let r = 0; r < h; r += 4) {
    g.fillStyle = mortar; g.fillRect(x, y + r + 3, w, 1);
    for (let u = (r / 4 % 2) * 6; u < w; u += 12) { g.fillRect(x + u, y + r, 1, 3); }
    for (let u = (r / 4 % 2) * 6; u < w; u += 12) { if (rnd() < .22) { g.fillStyle = rnd() < .5 ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.08)'; g.fillRect(x + u + 1, y + r, 11, 3); g.fillStyle = mortar; } }
  }
}
function stoneWall(c, x, y, w, h, base, seed) {
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(x, y, w, h); seedv = seed;
  for (let r = 0; r < h; r += 14) { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x, y + r + 13, w, 1);
    for (let u = (r / 14 % 2) * 14; u < w; u += 28) { g.fillRect(x + u, y + r, 1, 13); if (rnd() < .3) { g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(x + u + 1, y + r, 27, 13); g.fillStyle = 'rgba(0,0,0,.18)'; } } }
}
function windowArt(g, x, y, w, h, lit) {
  g.fillStyle = '#2a2a36'; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  const gl = g.createLinearGradient(0, y, 0, y + h); gl.addColorStop(0, '#8db4d6'); gl.addColorStop(1, '#4d79a6');
  g.fillStyle = gl; g.fillRect(x, y, w, h);
  g.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 6; i++) g.fillRect(x + 3 + i * 2, y + h - 8 - i * 3 - 2, 2, 2);
  g.fillStyle = '#2a2a36'; g.fillRect(x + (w >> 1), y, 1, h); g.fillRect(x, y + (h >> 1), w, 1);
  g.fillStyle = '#d9d1c1'; g.fillRect(x - 3, y + h + 2, w + 6, 3); g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x - 3, y + h + 5, w + 6, 1);
}

function makeShop(sp) {
  const spr = IM[sp.spr], sprH = spr.height, W = 224;
  const bodyH = Math.min(BODY_H, sprH), floors = sp.floors;
  const H = CORNICE_H + floors * FLOOR_H + bodyH;
  const front = cv(W, H), g = front.getContext('2d');
  const emis = cv(W, H), eg = emis.getContext('2d');
  // upper floors
  for (let i = 0; i < floors; i++) {
    const y0 = CORNICE_H + i * FLOOR_H;
    if (sp.stone) stoneWall(front, 0, y0, W, FLOOR_H, sp.wall, 11 + i * 3); else brick(front, 0, y0, W, FLOOR_H, sp.wall, sp.mortar || 'rgba(0,0,0,.22)', 31 + i * 5 + sp.seed);
    for (let c = 0; c < 3; c++) { const x = 20 + c * 76; windowArt(g, x, y0 + 10, 32, 34); seedv = sp.seed * 13 + i * 7 + c; if (rnd() < .62) { eg.fillStyle = 'rgba(255,205,120,1)'; eg.fillRect(x, y0 + 10, 32, 34); eg.fillStyle = 'rgba(40,20,0,.55)'; eg.fillRect(x + 15, y0 + 10, 1, 34); eg.fillRect(x, y0 + 26, 32, 1); } }
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, y0, 3, FLOOR_H); g.fillRect(W - 3, y0, 3, FLOOR_H);
    g.fillStyle = sp.trim || '#d4ccb9'; g.fillRect(0, y0 + FLOOR_H - 4, W, 3); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, y0 + FLOOR_H - 1, W, 1);
  }
  // cornice / parapet
  g.fillStyle = sp.trim || '#d4ccb9'; g.fillRect(-1, 0, W + 2, CORNICE_H - 2); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, 0, W, 1);
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, CORNICE_H - 2, W, 2);
  // the storefront, straight from our sprite (bottom 96 rows)
  g.drawImage(spr, 0, sprH - bodyH, W, bodyH, 0, H - bodyH, W, bodyH);
  // emissive mask for the shop windows: bluish glass pixels in the sprite glow warm at night
  { const t = cv(W, bodyH), tg = t.getContext('2d'); tg.drawImage(spr, 0, sprH - bodyH, W, bodyH, 0, 0, W, bodyH);
    const d = tg.getImageData(0, 0, W, bodyH), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const r = p[i], gg = p[i + 1], b = p[i + 2], a = p[i + 3]; const glass = a > 200 && b > r + 22 && b > gg - 6 && (r + gg + b) / 3 > 105; p[i] = 255; p[i + 1] = glass ? 205 : 0; p[i + 2] = glass ? 120 : 0; p[i + 3] = glass ? 235 : 0; }
    tg.putImageData(d, 0, 0); eg.drawImage(t, 0, H - bodyH); }
  // sign (the top of the shop sprite) becomes a rooftop card
  let sign = null; if (sprH > bodyH) { sign = cv(W, sprH - bodyH); sign.getContext('2d').drawImage(spr, 0, 0, W, sprH - bodyH, 0, 0, W, sprH - bodyH); }
  // side wall
  const side = cv(SIDE_D, H), s = side.getContext('2d');
  const wallUp = sp.stone ? sp.wall : sp.wall;
  if (sp.stone) stoneWall(side, 0, CORNICE_H, SIDE_D, H - CORNICE_H, wallUp, 5); else brick(side, 0, CORNICE_H, SIDE_D, H - CORNICE_H, wallUp, 'rgba(0,0,0,.25)', 77 + sp.seed);
  for (let i = 0; i < floors; i++) { const y0 = CORNICE_H + i * FLOOR_H; for (const x of [24, 74]) windowArt(s, x, y0 + 10, 22, 34); s.fillStyle = sp.trim || '#d4ccb9'; s.fillRect(0, y0 + FLOOR_H - 4, SIDE_D, 3); }
  s.fillStyle = 'rgba(0,0,0,.35)'; s.fillRect(0, H - bodyH, SIDE_D, bodyH); s.fillStyle = '#3a2a22'; s.fillRect(14, H - 46, 22, 46); s.fillStyle = '#caa56a'; s.fillRect(32, H - 24, 2, 2);
  s.fillStyle = 'rgba(70,70,80,.9)'; s.fillRect(SIDE_D - 18, CORNICE_H, 4, H - CORNICE_H);   // drainpipe
  s.fillStyle = sp.trim || '#d4ccb9'; s.fillRect(0, 0, SIDE_D, CORNICE_H - 2); s.fillStyle = 'rgba(0,0,0,.45)'; s.fillRect(0, CORNICE_H - 2, SIDE_D, 2);
  // roof
  const roof = cv(W, 64), r = roof.getContext('2d'); r.fillStyle = '#4a4e57'; r.fillRect(0, 0, W, 64); seedv = 3;
  for (let i = 0; i < 260; i++) { r.fillStyle = rnd() < .5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.16)'; r.fillRect(rnd() * W | 0, rnd() * 64 | 0, 2, 1); }
  r.fillStyle = sp.trim || '#d4ccb9'; r.fillRect(0, 0, W, 4); r.fillRect(0, 0, 4, 64); r.fillRect(W - 4, 0, 4, 64); r.fillRect(0, 60, W, 4);
  return { kind: 'shop', W, H, front, emis, side, roof, sign, vents: sp.vents || [], x: sp.x, spec: sp };
}

function makeHouse(sp) {
  const spr = IM[sp.spr], x0 = 0, y0 = sp.top, W = sp.w, H = spr.height - y0;
  const front = cv(W, H); front.getContext('2d').drawImage(spr, x0, y0, W, H, 0, 0, W, H);
  const roofH = sp.eave - y0, wallH = H - roofH;
  // side: siding wall + gable, drawn as one pentagon texture whose top is the ridge
  const D = 130, tex = cv(D, H), t = tex.getContext('2d');
  t.save(); t.beginPath(); t.moveTo(0, roofH); t.lineTo(D / 2, 0); t.lineTo(D, roofH); t.lineTo(D, H); t.lineTo(0, H); t.closePath(); t.clip();
  t.fillStyle = sp.siding; t.fillRect(0, 0, D, H);
  for (let y = roofH; y < H; y += 5) { t.fillStyle = 'rgba(0,0,0,.10)'; t.fillRect(0, y + 4, D, 1); }
  for (let y = 4; y < roofH; y += 5) { t.fillStyle = 'rgba(0,0,0,.08)'; t.fillRect(0, y + 4, D, 1); }
  windowArt(t, 22, roofH + 14, 22, 28); windowArt(t, 84, roofH + 14, 22, 28);
  t.fillStyle = '#6d6f8c'; t.fillRect(D / 2 - 9, roofH * .35, 18, 18); t.fillStyle = '#9cc2e0'; t.fillRect(D / 2 - 7, roofH * .35 + 2, 14, 14); // attic window
  t.restore();
  t.strokeStyle = sp.roof; t.lineWidth = 5; t.beginPath(); t.moveTo(-2, roofH + 2); t.lineTo(D / 2, 1); t.lineTo(D + 2, roofH + 2); t.stroke();
  const emis = cv(W, H), eg = emis.getContext('2d');
  { const d = front.getContext('2d').getImageData(0, 0, W, H), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const r = p[i], gg = p[i + 1], b = p[i + 2], a = p[i + 3]; const glass = a > 200 && b > r + 18 && b > gg - 2 && (r + gg + b) / 3 > 120 && ((i / 4 / W) | 0) > roofH; p[i] = 255; p[i + 1] = glass ? 200 : 0; p[i + 2] = glass ? 110 : 0; p[i + 3] = glass ? 230 : 0; }
    eg.putImageData(d, 0, 0); }
  return { kind: 'house', W, H, front, emis, sideTex: tex, D, roofH, wallH, x: sp.x, spec: sp };
}

// ===================== the street =====================
const STREET = [
  { t: 'shop', spr: 'shop_Bakery_1', floors: 2, wall: '#a3513c', trim: '#d9cdb4', seed: 1, x: 40 },
  { t: 'prop', k: 'tree', x: 322, lane: 0, v: 0 }, { t: 'prop', k: 'bench', x: 300, lane: 0 },
  { t: 'shop', spr: 'classic_bank_11', floors: 3, wall: '#8a909b', stone: true, trim: '#bfb9aa', seed: 2, x: 370 },
  { t: 'prop', k: 'lamp', x: 640, lane: 0 },
  { t: 'house', spr: 'house_medium_1', top: 12, eave: 108, w: 248, siding: '#d8d0dc', roof: '#4c4f6b', x: 700 },
  { t: 'prop', k: 'tree', x: 990, lane: 0, v: 1 },
  { t: 'shop', spr: 'shop_Ice_Cream_Shop_1', floors: 1, wall: '#b86d55', trim: '#e0d3b9', seed: 4, x: 1060 },
  { t: 'shop', spr: 'classic_butcher_1', floors: 2, wall: '#b4694d', trim: '#d8ccb2', seed: 5, x: 1290 },
  { t: 'prop', k: 'lamp', x: 1530, lane: 0 },
  { t: 'house', spr: 'house_small_1', top: 20, eave: 100, w: 184, siding: '#cfc6b2', roof: '#6b5a52', x: 1580 },
  { t: 'prop', k: 'tree', x: 1805, lane: 0, v: 2 },
  { t: 'shop', spr: 'shop_Gym_1', floors: 3, wall: '#8d4a3a', trim: '#cfc3ac', seed: 6, x: 1870 },
  { t: 'shop', spr: 'classic_music_store_1', floors: 2, wall: '#9a5a44', trim: '#d6caae', seed: 7, x: 2100 },
  { t: 'prop', k: 'lamp', x: 2340, lane: 0 }, { t: 'prop', k: 'bench', x: 2380, lane: 0 },
  { t: 'shop', spr: 'shop_Music_Store_1', floors: 2, wall: '#96704e', trim: '#d9cdb0', seed: 8, x: 2440 },
];
const FOREGROUND = [   // far-sidewalk props, drawn in front of everything (parallax 1.16)
  { k: 'lamp', x: 150, lane: 2 }, { k: 'tree', x: 560, lane: 2, v: 3 }, { k: 'lamp', x: 1010, lane: 2 }, { k: 'tree', x: 1460, lane: 2, v: 4 },
  { k: 'lamp', x: 1900, lane: 2 }, { k: 'tree', x: 2330, lane: 2, v: 5 }, { k: 'lamp', x: 2700, lane: 2 },
];
const WORLD_W = 2760;
let BUILDINGS = [], PROPS = [];
const EM = [];   // glow drawn after the colour grade, so lit windows and lamps stay bright at night

// ===================== sprites: silhouettes for shadows =====================
function silhouette(src) { const c = cv(src.width, src.height), g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height); return c; }
const SIL = new Map(); const silOf = img => { if (!SIL.has(img)) SIL.set(img, silhouette(img)); return SIL.get(img); };

// the time machine, parked in the road: a boxy stainless coupe (drawn in code; the pack has no cars)
function makeCar() {
  const c = cv(64, 40), g = c.getContext('2d');
  g.fillStyle = '#15171c'; g.fillRect(7, 28, 12, 9); g.fillRect(45, 28, 12, 9);
  g.fillStyle = '#8a909c'; g.fillRect(12, 33, 3, 3); g.fillRect(50, 33, 3, 3);
  g.fillStyle = '#aeb4c0'; g.fillRect(3, 14, 58, 17); g.fillRect(5, 12, 54, 3);
  g.fillStyle = '#d9dde6'; g.fillRect(5, 14, 54, 3); g.fillStyle = '#7d8492'; g.fillRect(3, 26, 58, 5);
  g.fillStyle = '#93a0b3'; g.fillRect(14, 4, 36, 11); g.fillStyle = '#1d2a3b'; g.fillRect(17, 6, 30, 8); g.fillStyle = '#5f8fc0'; g.fillRect(19, 7, 12, 2);
  g.fillStyle = '#66e0ff'; g.fillRect(8, 21, 48, 2); g.fillStyle = '#ffe27a'; g.fillRect(54, 17, 5, 4); g.fillStyle = '#ff5a4a'; g.fillRect(4, 17, 4, 4);
  return c;
}

// ===================== state =====================
const state = { cam: 120, vel: 0, hour: 17.6, fx: true, auto: true, lane: 0, laneF: 0, face: 0, walking: false, t: 0, drag: null };
const NPCS = [
  { sheet: 2, x: 500, lane: 0, dir: 1, sp: 22 }, { sheet: 3, x: 1150, lane: 0, dir: -1, sp: 28 }, { sheet: 4, x: 1700, lane: 1, dir: 1, sp: 40 },
  { sheet: 5, x: 2200, lane: 2, dir: -1, sp: 34 }, { sheet: 2, x: 900, lane: 2, dir: 1, sp: 30 },
];

// ===================== drawing =====================
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let LW = 640, LH = 400, GY = 280;
function resize() {
  const dpr = window.devicePixelRatio || 1, dw = Math.round(innerWidth * dpr), dh = Math.round(innerHeight * dpr);
  const S = Math.max(1, Math.floor(Math.min(dh / 380, dw / 340)));
  LW = Math.round(dw / S); LH = Math.round(dh / S);
  canvas.width = LW; canvas.height = LH; GY = Math.min(LH - 134, Math.round(LH * .62));
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);

function skyline(w, h, seed, minH, maxH, col) {
  const base = cv(w, h), g = base.getContext('2d'), em = cv(w, h), eg = em.getContext('2d'); seedv = seed;
  for (let x = 0; x < w;) { const bw = 18 + rnd() * 34 | 0, bh = minH + rnd() * (maxH - minH) | 0; g.fillStyle = col; g.fillRect(x, h - bh, bw, bh);
    if (rnd() < .25) g.fillRect(x + bw / 2 | 0, h - bh - 8, 1, 8);
    for (let wy = h - bh + 4; wy < h - 3; wy += 6) for (let wx = x + 3; wx < x + bw - 3; wx += 5) if (rnd() < .38) { eg.fillStyle = 'rgba(255,214,140,1)'; eg.fillRect(wx, wy, 2, 3); }
    x += bw + (rnd() * 4 | 0); }
  return { base, em };
}
let FAR, MID, STARS, CLOUDS;
function prepareWorld() {
  BUILDINGS = []; PROPS = [];
  for (const e of STREET) { if (e.t === 'shop') BUILDINGS.push(makeShop(e)); else if (e.t === 'house') BUILDINGS.push(makeHouse(e)); else PROPS.push({ ...e }); }
  for (const f of FOREGROUND) PROPS.push({ ...f, fg: true });
  FAR = skyline(1400, 150, 21, 40, 120, '#34406a'); MID = skyline(1400, 150, 99, 30, 90, '#2b3358');
  STARS = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * .6, b: Math.random() }));

  document.getElementById('auto').addEventListener('click', e => { state.auto = !state.auto; e.target.classList.toggle('on', state.auto); });
  setInterval(() => document.getElementById('auto').classList.toggle('on', state.auto), 400);
  function loop(ts) { const dt = last == null ? 0 : Math.min(.05, (ts - last) / 1000); last = ts; update(dt); frameDraw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  // hooks for screenshots
  window.__set = (o) => { Object.assign(state, o); if (o.hour != null) document.getElementById('time').value = o.hour; };
  window.__frame = () => { update(0); frameDraw(); };
}

// ===================== boot =====================
(async function () {
  const names = Object.keys(A);
  await Promise.all(names.map(n => new Promise((res, rej) => { const i = new Image(); i.onload = () => { IM[n] = i; res(); }; i.onerror = () => rej(new Error('sprite ' + n)); i.src = A[n]; })));
  resize(); CAR = makeCar(); prepareWorld(); setup();
  document.getElementById('load').remove();
})().catch(e => { document.getElementById('load').textContent = 'Error: ' + e.message; });
</script>
