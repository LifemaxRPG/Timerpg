<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Timerpg</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
    #game { position: fixed; inset: 0; }
    .panel { z-index: 2; }
    .panel { position: fixed; background: rgba(15, 18, 28, .86); border: 1px solid #3b4260; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4; }
    #hud { top: 10px; left: 10px; width: min(340px, calc(100vw - 44px)); }
    #hud h1 { font-size: 15px; margin: 0 0 6px; letter-spacing: .5px; }
    #year { font-size: 28px; font-weight: 700; }
    #hud input[type=range] { width: 100%; }
    #hud button { background: #2a3150; color: #eee; border: 1px solid #4a5480; border-radius: 6px; padding: 6px 10px; margin: 4px 4px 0 0; cursor: pointer; }
    #hud button.on { background: #5b6bd6; border-color: #8c98ff; }
    #info { bottom: 10px; left: 10px; width: min(380px, calc(100vw - 44px)); max-height: 60vh; overflow: auto; display: none; }
    #info .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px; padding: 5px 0; border-top: 1px solid #2f3652; }
    #info .row .who { flex: 1 1 100%; }
    #info button, #changes button { background: #2a3150; color: #eee; border: 1px solid #4a5480; border-radius: 6px; padding: 3px 8px; margin: 1px; cursor: pointer; font-size: 12px; }
    #info button:hover, #changes button:hover { background: #3b4580; }
    #info button.bad { border-color: #a05060; }
    #info button:disabled { opacity: .4; cursor: not-allowed; }
    #info select { background: #1b2036; color: #eee; border: 1px solid #4a5480; border-radius: 6px; padding: 3px; max-width: 170px; font-size: 12px; }
    #info .hint { color: #9aa3cc; font-size: 12px; margin-top: 6px; }
    #info .result { margin-top: 6px; font-size: 12px; }
    #info .result.ok { color: #9be39b; } #info .result.no { color: #ff9b9b; }
    #changes { top: 54px; right: 10px; width: min(330px, calc(100vw - 44px)); max-height: 55vh; overflow: auto; display: none; }
    #changes h2 { font-size: 13px; margin: 0 0 4px; color: #b9c1ff; }
    #changes .line { padding: 2px 0; }
    #diff { top: 10px; right: 10px; max-width: min(320px, calc(100vw - 44px)); display: none; }
    #banner { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -140%); opacity: 0; transition: transform .5s ease, opacity .5s ease; text-align: center; background: rgba(15, 18, 28, .9); border: 2px solid #8c98ff; border-radius: 12px; padding: 10px 28px 12px; z-index: 5; pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
    #banner.show { transform: translate(-50%, 0); opacity: 1; }
    #banner .welcome { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #aab; }
    #banner .name { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
    #banner .sub { font-size: 13px; color: #c8cdea; margin-top: 2px; }
    #loading { top: 10px; right: 10px; display: none; color: #c8cdea; }
    #hint { bottom: 10px; right: 10px; color: #aab; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud" class="panel">
    <h1>TIMERPG</h1>
    <div id="year">1950</div>
    <input id="slider" type="range" min="1950" max="2025" value="2025" />
    <div id="town" style="margin-top:6px"></div>
    <div id="mayor"></div>
  </div>
  <div id="info" class="panel"></div>
  <div id="changes" class="panel"></div>
  <div id="banner"><div class="welcome">Welcome to</div><div class="name"></div><div class="sub"></div></div>
  <div id="loading" class="panel">Generating nearby towns…</div>
  <div id="hint" class="panel">WASD / arrows to walk · click a building to act on it · slider = time machine</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
