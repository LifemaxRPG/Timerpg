<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Timerpg</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; touch-action: none; }
    .panel { z-index: 2; }
    .panel { position: fixed; background: rgba(15, 18, 28, .86); border: 1px solid #3b4260; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4; }
    #hud { top: 10px; left: 10px; width: min(340px, calc(100vw - 44px)); }
    #hud h1 { font-size: 15px; margin: 0 0 6px; letter-spacing: .5px; }
    #year { font-size: 28px; font-weight: 700; }
    #hud input[type=range] { width: 100%; }
    #hud button { background: #2a3150; color: #eee; border: 1px solid #4a5480; border-radius: 6px; padding: 6px 10px; margin: 4px 4px 0 0; cursor: pointer; }
    #hud button.on { background: #5b6bd6; border-color: #8c98ff; }
    #info { bottom: 10px; left: 10px; width: min(380px, calc(100vw - 44px)); max-height: 60vh; overflow: auto; display: none; }
    #info .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px; padding: 5px 0; border-top: 1px solid #2f3652; }
    #info .row .who { flex: 1 1 100%; }
    #info button, #changes button { background: #2a3150; color: #eee; border: 1px solid #4a5480; border-radius: 6px; padding: 3px 8px; margin: 1px; cursor: pointer; font-size: 12px; }
    #info button:hover, #changes button:hover { background: #3b4580; }
    #info button.bad { border-color: #a05060; }
    #info button:disabled { opacity: .4; cursor: not-allowed; }
    #info select { background: #1b2036; color: #eee; border: 1px solid #4a5480; border-radius: 6px; padding: 3px; max-width: 170px; font-size: 12px; }
    #talk { bottom: 10px; left: 10px; width: min(400px, calc(100vw - 44px)); max-height: 70vh; overflow: auto; display: none; }
    #talk .head { display: flex; justify-content: space-between; font-size: 15px; }
    #talk .sub { color: #9aa3cc; font-size: 12px; margin-bottom: 6px; }
    #talk .line { background: #1b2036; border-radius: 8px; padding: 8px 10px; margin: 4px 0 8px; font-style: italic; line-height: 1.35; }
    #talk .opts { display: flex; flex-direction: column; gap: 4px; margin: 4px 0; }
    #talk button { text-align: left; background: #2a3150; color: #eee; border: 1px solid #4a5480; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; }
    #talk button:hover:not(:disabled) { background: #3b4580; }
    #talk button.bad { border-color: #a05060; }
    #talk button:disabled { opacity: .45; cursor: not-allowed; }
    #talk button small { display: block; color: #9aa3cc; font-size: 11px; margin-top: 2px; }
    #talk summary { cursor: pointer; color: #b58; font-size: 12px; margin-top: 6px; }
    #talk .close, #info .close { cursor: pointer; padding: 0 6px; }
    #talk .hint { color: #9aa3cc; font-size: 12px; margin-top: 6px; }
    #note { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); display: none; max-width: min(520px, 90vw); text-align: center; z-index: 5; }
    #info .hint { color: #9aa3cc; font-size: 12px; margin-top: 6px; }
    #info .result { margin-top: 6px; font-size: 12px; }
    #info .result.ok { color: #9be39b; } #info .result.no { color: #ff9b9b; }
    #changes { top: 54px; right: 10px; width: min(330px, calc(100vw - 44px)); max-height: 55vh; overflow: auto; display: none; }
    #changes h2 { font-size: 13px; margin: 0 0 4px; color: #b9c1ff; }
    #changes .line { padding: 2px 0; }
    #diff { top: 10px; right: 10px; max-width: min(320px, calc(100vw - 44px)); display: none; }
    #banner { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -140%); opacity: 0; transition: transform .5s ease, opacity .5s ease; text-align: center; background: rgba(15, 18, 28, .9); border: 2px solid #8c98ff; border-radius: 12px; padding: 10px 28px 12px; z-index: 5; pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
    #banner.show { transform: translate(-50%, 0); opacity: 1; }
    #banner .welcome { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #aab; }
    #banner .name { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
    #banner .sub { font-size: 13px; color: #c8cdea; margin-top: 2px; }
    #loading { top: 10px; right: 10px; display: none; color: #c8cdea; }
    #hud .yearrow { display: flex; align-items: center; gap: 6px; }
    #hud .yearrow input[type=range] { flex: 1; min-width: 0; }
    #hud .step { padding: 4px 9px; margin: 0; font-size: 14px; }
    #info .head { display: flex; justify-content: space-between; align-items: center; }
    #info .close { cursor: pointer; padding: 0 6px; font-size: 20px; line-height: 1; color: #aab; }
    #zoom { position: fixed; right: 12px; bottom: 56px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
    #zoom button { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; background: rgba(15,18,28,.8); color: #eee; border: 1px solid #3b4260; cursor: pointer; }
    #stick { position: fixed; left: calc(22px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.28); touch-action: none; display: none; z-index: 4; }
    #stick #knob { position: absolute; left: 36px; top: 36px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.4); border: 2px solid rgba(255,255,255,.6); pointer-events: none; }
    body.touch #stick { display: block; }
    body.touch #hint { display: none; }
    body.touch #hud button, body.touch #zoom button { min-height: 40px; }
    /* Phones: smaller panels, the action panel sits above the joystick. */
    @media (max-width: 720px), (max-height: 520px) {
      #hud { width: min(250px, calc(100vw - 24px)); padding: 7px 9px; font-size: 12px; }
      #hud h1 { display: none; }
      #year { font-size: 22px; }
      #banner .name { font-size: 22px; } #banner { padding: 8px 18px 10px; }
      #info { left: 10px; right: 10px; width: auto; bottom: 170px; max-height: 42vh; }
      body:not(.touch) #info { bottom: 10px; }
      #changes { top: auto; bottom: 12px; right: 10px; left: auto; width: min(240px, calc(100vw - 190px)); max-height: 28vh; font-size: 11px; }
      #loading { top: auto; bottom: 150px; right: 10px; font-size: 11px; }
      #zoom { bottom: calc(50vh); }
    }
    #door { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:6; max-width:calc(100vw - 44px); padding:12px 18px; border:1px solid #e8cf8e; border-radius:10px; color:#fff5d8; background:rgba(15,18,28,.94); font:600 14px system-ui; cursor:pointer; display:none; }
    body.touch #door { left:auto; right:12px; transform:none; bottom:24px; max-width:calc(100vw - 184px); }
    #hint { bottom: 10px; right: 10px; color: #aab; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud" class="panel">
    <h1>TIMERPG</h1>
    <div id="year">1950</div>
    <div id="clock" style="opacity:.8"></div>
    <div class="yearrow"><button class="step" id="yminus" aria-label="Previous year">◀</button><input id="slider" type="range" min="1950" max="2025" value="2025" /><button class="step" id="yplus" aria-label="Next year">▶</button></div>
    <div id="town" style="margin-top:6px"></div>
    <div id="mayor"></div>
  </div>
  <div id="talk" class="panel"></div>
  <div id="note" class="panel"></div>
  <div id="info" class="panel"></div>
  <div id="changes" class="panel"></div>
  <div id="banner"><div class="welcome">Welcome to</div><div class="name"></div><div class="sub"></div></div>
  <div id="loading" class="panel">Generating nearby towns…</div>
  <div id="hint" class="panel">WASD / arrows to walk · E at a door to enter · Esc to leave · slider = time machine</div>
  <div id="zoom"><button id="zin" aria-label="Zoom in">＋</button><button id="zout" aria-label="Zoom out">－</button></div>
  <button id="door" aria-label="Enter or leave building"></button>
  <div id="stick"><div id="knob"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
